services:

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: newdb
    ports:
      - "3306:3306"

  backend:
    build: ./backend
    ports:
      - "9090:9090"
    depends_on:
      - db
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
