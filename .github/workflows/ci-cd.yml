name: DevSecOps Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Run Gitleaks Scan
      uses: zricethezav/gitleaks-action@v2
      
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Backend Dependency Scan
      run: |
        cd backend
        chmod +x mvnw
        ./mvnw clean verify

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Frontend Audit
      run: |
        cd frontend
        npm install
        npm audit --audit-level=high

    - name: Build Backend
      run: |
        cd backend
        ./mvnw clean package -DskipTests

    - name: Build Frontend
      run: |
        cd frontend
        npm install
        npm run build

    - name: Build Docker Images
      run: docker compose build

    - name: Scan Docker Images
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'image'
        image-ref: '${{ secrets.DOCKER_USERNAME }}/course-backend'

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Backend Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/course-backend ./backend
        docker push ${{ secrets.DOCKER_USERNAME }}/course-backend

    # 🚀 Push Frontend
    - name: Build and Push Frontend Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/course-frontend ./frontend
        docker push ${{ secrets.DOCKER_USERNAME }}/course-frontend
