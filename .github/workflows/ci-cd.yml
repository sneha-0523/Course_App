name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DOCKER_IMAGE_BACKEND: ${{ secrets.DOCKER_USERNAME }}/course-backend
      DOCKER_IMAGE_FRONTEND: ${{ secrets.DOCKER_USERNAME }}/course-frontend

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Backend
      run: |
        cd backend
        chmod +x mvnw
        ./mvnw clean package -DskipTests

    - name: Run Backend Tests
      run: |
        cd backend
        ./mvnw test

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Build Frontend
      run: |
        cd frontend
        npm install
        npm run build

    - name: Scan for Secrets
      uses: gitleaks/gitleaks-action@v2

    - name: Build Docker Images
      run: docker compose build

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Backend Image
      run: |
        docker build -t $DOCKER_IMAGE_BACKEND ./backend
        docker push $DOCKER_IMAGE_BACKEND

    - name: Build and Push Frontend Image
      run: |
        docker build -t $DOCKER_IMAGE_FRONTEND ./frontend
        docker push $DOCKER_IMAGE_FRONTEND

    - name: Scan Backend Image (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.DOCKER_IMAGE_BACKEND }}
        format: table
        exit-code: 1
        ignore-unfixed: true

    - name: Scan Frontend Image (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.DOCKER_IMAGE_FRONTEND }}
        format: table
        exit-code: 1
        ignore-unfixed: true
